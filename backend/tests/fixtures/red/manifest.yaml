# Per-fixture expected-hit pins. See eval-strengthening plan §1.1.
#
# A red fixture passing on label alone proves nothing about *why* — this file
# pins the specific rule(s)/capability(ies)/provenance that must appear in
# `result.verdict.findings` so the gate can tell LABEL_MISS (nothing fired)
# apart from WRONG_REASON (something fired, but not the mechanism this
# fixture exists to test).

evasion_base64.md:
  min_label: SUSPICIOUS
  must_include_rules: [SC-SH1]
  must_include_capabilities: [stage2_fetch]
  must_have_provenance: [base64]

