# Render Blueprint for SkillCheck.
# Deploy: Render Dashboard -> New -> Blueprint -> point at the repo containing this file.
#
# SkillCheck is one FastAPI service that also serves the static frontend
# (see FRONTEND_DIR in backend/api/main.py) - a single web service, not a
# split frontend/backend deploy. Build context is the repo root so the
# Dockerfile can copy both backend/ and frontend/ into the image.
services:
  - type: web
    name: skillcheck
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Optional. Without either key below, the adjudicator falls back to a
      # deterministic tiering heuristic (still fully functional, see
      # adjudicator.py) - SkillCheck runs end-to-end with zero required env
      # vars. If both are set, ANTHROPIC_API_KEY wins.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional. Overrides the adjudicator model when using ANTHROPIC_API_KEY
      # (default: claude-sonnet-5).
      - key: SKILLCHECK_ADJUDICATOR_MODEL
        sync: false
      # Optional alternative to ANTHROPIC_API_KEY - routes the adjudicator
      # through OpenRouter's model catalog instead of calling Anthropic
      # directly. Only used when ANTHROPIC_API_KEY is unset.
      - key: OPENROUTER_API_KEY
        sync: false
      # Optional. Model to use via OpenRouter (default: anthropic/claude-sonnet-4.5).
      - key: SKILLCHECK_OPENROUTER_MODEL
        sync: false
